<!doctype html>
<html lang="zh-Hant">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Surface Parameterization Demo</title>
	<link rel="icon" href="images/NTNU.svg" sizes="32x32" />
	<link rel="icon" href="images/NTNU.svg" sizes="192x192" />
	<script type="importmap">
	{
		"imports": {
		"three": "./vendor/three/build/three.module.js",
		"three/addons/": "./vendor/three/examples/jsm/"
		}
	}
	</script>
	<link rel="stylesheet" href="./styles/style.css" />

	<style>
		.floating-panel{ position:fixed; right:1rem; bottom:1rem; width:min(360px, 92vw);
			max-height:70vh; overflow:auto; background:rgba(22,22,30,.92); color:#fff;
			backdrop-filter:saturate(160%) blur(8px);
			border:1px solid rgba(255,255,255,.12); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.35);
			font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
			z-index: 1000; }
		.floating-panel header{ display:flex; align-items:center; justify-content:space-between; padding:.6rem .8rem; border-bottom:1px solid rgba(255,255,255,.08); font-weight:600; letter-spacing:.02em; }
		.floating-panel .body{ padding:.6rem .8rem .8rem; }
		.floating-panel .row{ display:flex; align-items:center; gap:.5rem; margin:.4rem 0; flex-wrap:wrap; }
		.floating-panel label{ opacity:.85; }
		.floating-panel input[type="range"]{ width: 160px; }
		.floating-panel input[type="file"]{ max-width: 220px; }
		.floating-panel select, .floating-panel input[type="color"], .floating-panel input[type="checkbox"]{ accent-color:#6cf; }
		.floating-panel .muted{ opacity:.7; font-size:.92em; }
	</style>

</head>

<body>

	<header style="display:flex; align-items:center; gap:20px">
		<img src="./images/NTNU.svg" alt="NTNU" style="height:72px; display:block">
		<h1>Surface Parameterization Demo</h1>
	</header>
	
	<main>
	
		<section class="panel">
			<div id="scene3d" style="width:100%; aspect-ratio:1/1;"></div>
		</section>
		
		<section class="panel">
			<div id="uvScene" style="width:100%; aspect-ratio:1/1;"></div>
		</section>
	
	
		<div id="controlDock" class="dock">
		
			<div class="dock-group left" style="width:20%;">
				<label class="row file-trigger" for="fileInput">Import OBJ</label>
				<input type="file" id="fileInput" accept=".obj" />
				<span id="uvSourceBadge" class="badge">UV: N/A</span>
			</div>
			
			<div class="dock-group mid" style="width:35%;">
				<label class="row">Maps</label>
				<button id="btnCompute">Harmonic</button>
				<button id="btnLC">Conformal</button>
				<button id="btnAP">Authalic</button>
				<button id="btnBEM">Balanced</button>
			</div>
			
			<div class="dock-group right" style="width:45%;">
				<label class="lbl small">3D Grid</label>
				<input type="checkbox" id="chkWire3d" />
				<label class="lbl small">UV Grid</label>
				<input type="checkbox" id="chkWire" />
				<button id="btnMeshEditToggle" type="button" aria-controls="meshEditPanel" aria-expanded="false">Mesh Edit</button>
				<button id="btnOutputToggle" type="button" aria-controls="outputPanel" aria-expanded="false">Output</button>
				<button id="btnReset">Reset</button>
				<span id="stats" class="stats"></span>
			</div>
			
		</div>
		
	</main>

	<footer>
		<small>Copyright 2025 Geometric Optimization Lab, National Taiwan Normal University.</small>
	</footer>
	
	<div id="meshEditPanel" class="floating-panel mesh-edit-panel" hidden>
		<header>
			<span>Mesh Edit</span>
			<button id="btnMeshEditClose" class="panel-close" type="button" aria-label="Hide mesh editing tools">Hide</button>
		</header>
		<div class="body">
			<div class="row">
				<label class="lbl small" title="Click on either view to select">Select</label>
				<select id="selPickMode" class="select" title="Selection mode (Face / Vertex / Connected Face Patch)">
					<option value="face" selected>Face</option>
					<option value="vertex">Vertex</option>
					<option value="patch">Patch</option>
				</select>
				<label class="lbl small" title="Select an n-ring neighborhood around the picked element (0 = just the picked element)">n-ring</label>
				<input type="number" id="selNRing" min="0" max="50" step="1" value="0" style="width:64px" title="n-ring neighborhood (0..50)" />
			</div>
			<div class="row">
				<button id="btnDeleteSel" title="Delete selected vertex/face">Delete</button>
				<button id="btnDeletePatchVerts" title="Delete all vertices in the selected patch (also removes incident faces)">Del Patch Vert</button>
				<button id="btnClearSel" title="Clear selection">Clear</button>
			</div>
			<div class="row">
				<button id="btnCleanUnref" title="Remove unreferenced vertices (vertices not used by any face)">Clean Unref V</button>
				<button id="btnRemoveLeafFaces" title="Remove leaf faces (faces whose all vertices are boundary vertices)">Remove Leaf Faces</button>
				<button id="btnKeepMaxPatch" title="Keep only the connected face patch with the maximal number of faces; remove all other patches">Keep Max Patch</button>
			</div>
			<div class="row">
				<span id="selBadge" class="badge" title="Current selection">Sel: none</span>
			</div>
		</div>
	</div>
	
	<div id="outputPanel" class="floating-panel output-panel" hidden>
		<header>
			<span>Output</span>
			<button id="btnOutputClose" class="panel-close" type="button" aria-label="Hide output tools">Hide</button>
		</header>
		<div class="body">
			<div class="row">
				<button id="btnSaveSurface">Save Surface PNG</button>
				<button id="btnSaveUV">Save UV PNG</button>
				<button id="btnExport">Export OBJ</button>
			</div>
		</div>
	</div>
	
	<script type="module" src="./js/app.js"></script>


	<div id="materialsPanel" class="floating-panel" style="display:none;">
		<header>
			<span>Material Rendering</span>
			<span class="muted">PBR / IBL</span>
		</header>
		<div class="body">
			<div class="row">
				<label for="matType">Type</label>
				<select id="matType">
					<option value="standard">PBR Standard</option>
					<option value="physical">PBR Physical</option>
					<option value="phong">Phong</option>
					<option value="lambert">Lambert</option>
					<option value="basic">Basic</option>
					<option value="toon">Toon</option>
				</select>
			</div>
			<div class="row">
				<label for="matPreset">Preset</label>
				<select id="matPreset">
					<option value=""></option>
					<option value="metal_brass">Brass Metal</option>
					<option value="plastic_pe_red">Red Plastic</option>
					<option value="ceramic_glaze">Ceramic Glaze</option>
					<option value="car_paint_gloss">Glossy Car Paint</option>
					<option value="glass_clear">Clear Glass</option>
				</select>
			</div>
			<div class="row">
				<label for="matColor">Color</label> <input type="color" id="matColor" value="#ffffff" />
			</div>
			<div class="row">
				<label for="matMetalness">Metalness</label> <input type="range" id="matMetalness" min="0" max="1" step="0.01" value="0.25" />
			</div>
			<div class="row">
				<label for="matRoughness">Roughness</label> <input type="range" id="matRoughness" min="0" max="1" step="0.01" value="0.65" />
			</div>
			<div class="row">
				<label for="matClearcoat">Clearcoat</label> <input type="range" id="matClearcoat" min="0" max="1" step="0.01" value="0.0" />
			</div>
			<div class="row">
				<label for="matClearcoatRoughness">Clearcoat Rough.</label> <input type="range" id="matClearcoatRoughness" min="0" max="1" step="0.01" value="0.1" />
			</div>
			<div class="row">
				<label for="matSheen">Sheen</label> <input type="range" id="matSheen" min="0" max="1" step="0.01" value="0.0" />
				<label for="matSheenColor">Sheen Color</label> <input type="color" id="matSheenColor" value="#ffffff" />
			</div>
			<div class="row">
				<label for="matTransmission">Transmission</label> <input type="range" id="matTransmission" min="0" max="1" step="0.01" value="0.0" />
				<label for="matThickness">Thickness</label> <input type="range" id="matThickness" min="0" max="5" step="0.01" value="1.0" />
				<label for="matIOR">IOR</label> <input type="range" id="matIOR" min="1.0" max="2.5" step="0.01" value="1.5" />
			</div>
			<div class="row">
				<label><input type="checkbox" id="useIBL" checked /> IBL Lighting</label>
				<label for="envIntensity">Intensity</label> <input type="range" id="envIntensity" min="0" max="2" step="0.01" value="1.0" />
			</div>
			<div class="row">
				<label><input type="checkbox" id="useChecker" checked /> Use UV Checker Texture</label>
			</div>
			<div class="row">
				<label for="texUpload">Upload Texture</label>
				<input type="file" id="texUpload" accept="image/*" />
				<button id="btnTexClear" type="button">Restore Checker</button>
			</div>
			<div class="row">
				<span id="texInfo" class="muted">Texture: Checkerboard</span>
			</div>
		</div>
	</div>

</body>
</html>
